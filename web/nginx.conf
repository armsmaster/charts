server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded CSVs and logos pass through here.
    client_max_body_size 25m;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # The UI and the API share an origin, so no CORS and no tainted canvas when
    # the browser rasterises a chart that references the watermark by URL.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long candle ranges and server-side PNG rendering are not instant.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
